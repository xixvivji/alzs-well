services:
  gateway:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - alzs-well-app
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-alzs_well}
      DB_USERNAME: ${POSTGRES_USER:-alzswell}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      NETWORK_MODE: AIR_GAPPED_DEMO
      EXTERNAL_EGRESS_ENABLED: "false"
      REMOTE_MODEL_ENABLED: "false"
      DEMO_MAX_ACTIVE_SESSIONS: ${DEMO_MAX_ACTIVE_SESSIONS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alzs-well-app
      - alzs-well-data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alzs_well}
      POSTGRES_USER: ${POSTGRES_USER:-alzswell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - alzs-well-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - alzs-well-data

networks:
  alzs-well-app:
    internal: true
    driver: bridge
  alzs-well-data:
    internal: true
    driver: bridge

volumes:
  alzs-well-postgres-data:

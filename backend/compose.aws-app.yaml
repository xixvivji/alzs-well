name: alzs-well-app

services:
  gateway:
    image: ${NGINX_IMAGE:?NGINX_IMAGE must be an immutable ECR digest}
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND_ADDRESS:?GATEWAY_BIND_ADDRESS must be the private EC2 address}:8080:8080"
    environment:
      NGINX_ENVSUBST_FILTER: TRUSTED_PROXY_CIDR|FRONTEND_PROXY_SHARED_SECRET
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:?TRUSTED_PROXY_CIDR must be the ALB subnet CIDR}
      FRONTEND_PROXY_SHARED_SECRET: ${FRONTEND_PROXY_SHARED_SECRET:?FRONTEND_PROXY_SHARED_SECRET must be set}
    entrypoint: ["/bin/sh", "/opt/alzs-well/validate-gateway-env.sh"]
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./docker/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/validate-gateway-env.sh:/opt/alzs-well/validate-gateway-env.sh:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/v1/system/readiness | grep -q '\"ready\":true'"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-northeast-2}
        awslogs-group: ${APP_LOG_GROUP:?APP_LOG_GROUP must be set}
        awslogs-stream: gateway
        awslogs-create-group: "false"
    networks: [ingress, app]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable ECR digest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      PUBLIC_DEPLOYMENT: "true"
      CORS_CUSTOMER_ALLOWED_ORIGINS: ${CORS_CUSTOMER_ALLOWED_ORIGINS:?CORS_CUSTOMER_ALLOWED_ORIGINS must be set}
      CORS_STAFF_ALLOWED_ORIGINS: ${CORS_STAFF_ALLOWED_ORIGINS:?CORS_STAFF_ALLOWED_ORIGINS must be set}
      DEMO_STAFF_BOOTSTRAP_TOKEN: ${DEMO_STAFF_BOOTSTRAP_TOKEN:?DEMO_STAFF_BOOTSTRAP_TOKEN must be set}
      DB_URL: jdbc:postgresql://${RDS_HOST:?RDS_HOST must be set}:5432/${RDS_DATABASE:-alzs_well}?sslmode=verify-full&sslrootcert=/run/secrets/rds-ca.pem
      DB_USERNAME: ${RDS_APP_USER:-alzswell_app}
      DB_PASSWORD: ${RDS_APP_PASSWORD:?RDS_APP_PASSWORD must be set}
      SPRING_FLYWAY_USER: ${RDS_MIGRATION_USER:-alzswell_migrator}
      SPRING_FLYWAY_PASSWORD: ${RDS_MIGRATION_PASSWORD:?RDS_MIGRATION_PASSWORD must be set}
      AI_RETRIEVAL_ENABLED: "true"
      AI_ASSISTANCE_ENABLED: "true"
      AI_RETRIEVAL_BASE_URL: https://${AI_PRIVATE_DNS:-ai.internal}:8443
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN must be set}
      AI_RETRIEVAL_STRICT_READINESS: "true"
      AI_REQUIRE_FOR_CORE_READINESS: "false"
      AI_TLS_KEY_STORE: /run/secrets/ai-client.p12
      AI_TLS_KEY_STORE_PASSWORD: ${AI_TLS_KEY_STORE_PASSWORD:?AI_TLS_KEY_STORE_PASSWORD must be set}
      AI_TLS_KEY_STORE_TYPE: PKCS12
      AI_TLS_TRUST_STORE: /run/secrets/ai-truststore.p12
      AI_TLS_TRUST_STORE_PASSWORD: ${AI_TLS_TRUST_STORE_PASSWORD:?AI_TLS_TRUST_STORE_PASSWORD must be set}
      AI_TLS_TRUST_STORE_TYPE: PKCS12
      AI_EXPECTED_MODEL_STATUS: STAGED_APPROVED
      AI_EXPECTED_EMBEDDING_BACKEND: ${AI_EXPECTED_EMBEDDING_BACKEND:-local-arctic-ko}
      AI_EXPECTED_EMBEDDING_DIMENSIONS: ${AI_EXPECTED_EMBEDDING_DIMENSIONS:-1024}
      AI_EXPECTED_MODEL_REVISION: ${AI_EXPECTED_MODEL_REVISION:?AI_EXPECTED_MODEL_REVISION must be set}
      AI_EXPECTED_ARTIFACT_SHA256: ${AI_EXPECTED_ARTIFACT_SHA256:?AI_EXPECTED_ARTIFACT_SHA256 must be set}
      AI_EXPECTED_GOLDEN_SET_SHA256: ${AI_EXPECTED_GOLDEN_SET_SHA256:?AI_EXPECTED_GOLDEN_SET_SHA256 must be set}
      AI_EXPECTED_INDEX_VERSION: hybrid-arctic-ko-v1
      AI_EXPECTED_DEPLOYMENT_ENVIRONMENT: AWS_STAGING
      COPILOT_RAG_ENABLED: "true"
      NETWORK_MODE: AIR_GAPPED_DEMO
      EXTERNAL_EGRESS_ENABLED: "false"
      REMOTE_MODEL_ENABLED: "false"
      SYNTHETIC_PROVIDER_ONLY: "true"
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    volumes:
      - ${RDS_CA_BUNDLE_PATH:?RDS_CA_BUNDLE_PATH must be set}:/run/secrets/rds-ca.pem:ro
      - ${AI_TLS_KEY_STORE_PATH:?AI_TLS_KEY_STORE_PATH must be set}:/run/secrets/ai-client.p12:ro
      - ${AI_TLS_TRUST_STORE_PATH:?AI_TLS_TRUST_STORE_PATH must be set}:/run/secrets/ai-truststore.p12:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/v1/system/readiness | grep -q '\"ready\":true'"]
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 45s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-northeast-2}
        awslogs-group: ${APP_LOG_GROUP:?APP_LOG_GROUP must be set}
        awslogs-stream: backend
        awslogs-create-group: "false"
    networks: [app, egress]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s

networks:
  ingress:
  app:
    internal: true
  egress:

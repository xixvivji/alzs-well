server:
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: 16KB
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 32KB
    max-swallow-size: 32KB

spring:
  application:
    name: alzs-well-backend
    version: ${APPLICATION_VERSION:0.0.1-SNAPSHOT}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alzs_well}
    username: ${DB_USERNAME:alzswell}
    password: ${DB_PASSWORD:alzs_well_local_password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: always
    time-zone: UTC
  servlet:
    multipart:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: false
    supported-submit-methods: []
    operations-sorter: method
    tags-sorter: alpha

info:
  app:
    name: ${spring.application.name}
    description: 금융생활 변화 조기알림 및 행원 보호업무 코파일럿

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  guardrails:
    synthetic-data-only: ${SYNTHETIC_DATA_ONLY:true}
    external-actions-enabled: ${EXTERNAL_ACTIONS_ENABLED:false}
    network-mode: ${NETWORK_MODE:AIR_GAPPED_DEMO}
    external-egress-enabled: ${EXTERNAL_EGRESS_ENABLED:false}
    remote-model-enabled: ${REMOTE_MODEL_ENABLED:false}
    synthetic-provider-only: ${SYNTHETIC_PROVIDER_ONLY:true}
  demo:
    session-ttl-seconds: ${DEMO_SESSION_TTL_SECONDS:7200}
    max-active-sessions: ${DEMO_MAX_ACTIVE_SESSIONS:1000}
    default-locale: ${DEMO_DEFAULT_LOCALE:ko-KR}
  versions:
    api: v1
    schema: "9"
    fixture: fin-mgmt-ab-v2.0.0
    algorithm: baseline-rules-v2.0.0
    policy: context-policy-v1.0.0
    source-catalog-checked-at: 2026-08-14

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

server:
  address: ${SERVER_ADDRESS}
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: 16KB
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 32KB
    max-swallow-size: 32KB

spring:
  application:
    name: alzs-well-backend
    version: ${APPLICATION_VERSION:0.0.1-SNAPSHOT}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: always
    time-zone: UTC
  servlet:
    multipart:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: false
    supported-submit-methods: []
    operations-sorter: method
    tags-sorter: alpha

info:
  app:
    name: ${spring.application.name}
    description: 금융생활 변화 조기알림 및 행원 보호업무 코파일럿

app:
  cors:
    customer-allowed-origins: ${CORS_CUSTOMER_ALLOWED_ORIGINS:}
    staff-allowed-origins: ${CORS_STAFF_ALLOWED_ORIGINS:}
    require-https: false
  deployment:
    public-exposure: ${PUBLIC_DEPLOYMENT}
  guardrails:
    synthetic-data-only: ${SYNTHETIC_DATA_ONLY:true}
    external-actions-enabled: ${EXTERNAL_ACTIONS_ENABLED:false}
    network-mode: ${NETWORK_MODE:AIR_GAPPED_DEMO}
    external-egress-enabled: ${EXTERNAL_EGRESS_ENABLED:false}
    remote-model-enabled: ${REMOTE_MODEL_ENABLED:false}
    synthetic-provider-only: ${SYNTHETIC_PROVIDER_ONLY:true}
  demo:
    session-ttl-seconds: ${DEMO_SESSION_TTL_SECONDS:7200}
    max-active-sessions: ${DEMO_MAX_ACTIVE_SESSIONS:1000}
    default-locale: ${DEMO_DEFAULT_LOCALE:ko-KR}
    cleanup-interval-ms: ${DEMO_CLEANUP_INTERVAL_MS:300000}
    cleanup-batch-size: ${DEMO_CLEANUP_BATCH_SIZE:100}
  features:
    # 기본 비활성. 공개 합성 회원 환경은 production의 결합 플래그로만 함께 활성화한다.
    customer-profile-api-enabled: ${CUSTOMER_PROFILE_API_ENABLED:false}
    # 일반 합성 인증은 로컬 검증용이며 공개 환경에서는 PUBLIC fixture 제한이 추가된다.
    local-auth-api-enabled: ${LOCAL_AUTH_API_ENABLED:false}
    public-synthetic-member-auth-enabled: ${PUBLIC_SYNTHETIC_MEMBER_AUTH_ENABLED:false}
  ai-retrieval:
    enabled: ${AI_RETRIEVAL_ENABLED:false}
    base-url: ${AI_RETRIEVAL_BASE_URL:http://127.0.0.1:8000}
    internal-token: ${AI_INTERNAL_TOKEN:}
    connect-timeout-ms: ${AI_RETRIEVAL_CONNECT_TIMEOUT_MS:500}
    request-timeout-ms: ${AI_RETRIEVAL_REQUEST_TIMEOUT_MS:1500}
    strict-readiness: ${AI_RETRIEVAL_STRICT_READINESS:false}
    require-for-core-readiness: ${AI_REQUIRE_FOR_CORE_READINESS:${AI_RETRIEVAL_STRICT_READINESS:false}}
    expected-model-status: ${AI_EXPECTED_MODEL_STATUS:}
    expected-embedding-backend: ${AI_EXPECTED_EMBEDDING_BACKEND:}
    expected-embedding-dimensions: ${AI_EXPECTED_EMBEDDING_DIMENSIONS:0}
    expected-model-revision: ${AI_EXPECTED_MODEL_REVISION:}
    expected-artifact-sha256: ${AI_EXPECTED_ARTIFACT_SHA256:}
    expected-golden-set-sha256: ${AI_EXPECTED_GOLDEN_SET_SHA256:}
    expected-index-version: ${AI_EXPECTED_INDEX_VERSION:}
    expected-deployment-environment: ${AI_EXPECTED_DEPLOYMENT_ENVIRONMENT:}
    tls:
      require-https: ${AI_TLS_REQUIRE_HTTPS:false}
      key-store: ${AI_TLS_KEY_STORE:}
      key-store-password: ${AI_TLS_KEY_STORE_PASSWORD:}
      key-store-type: ${AI_TLS_KEY_STORE_TYPE:PKCS12}
      trust-store: ${AI_TLS_TRUST_STORE:}
      trust-store-password: ${AI_TLS_TRUST_STORE_PASSWORD:}
      trust-store-type: ${AI_TLS_TRUST_STORE_TYPE:PKCS12}
  ai-assistance:
    enabled: ${AI_ASSISTANCE_ENABLED:${AI_RETRIEVAL_ENABLED:false}}
  copilot:
    rag-enabled: ${COPILOT_RAG_ENABLED:false}
  synthetic-seed:
    enabled: ${SYNTHETIC_SEED_ENABLED:false}
    profile: ${SYNTHETIC_SEED_PROFILE:SMOKE}
    fixture-version: ${SYNTHETIC_SEED_FIXTURE_VERSION:synthetic-v3.1.0}
    seed: ${SYNTHETIC_SEED_VALUE:20260825}
    batch-size: ${SYNTHETIC_SEED_BATCH_SIZE:10}
    resume: ${SYNTHETIC_SEED_RESUME:false}
    verify-detection: ${SYNTHETIC_SEED_VERIFY_DETECTION:false}
    provision-members: ${SYNTHETIC_SEED_PROVISION_MEMBERS:false}
    member-password-hash: ${SYNTHETIC_MEMBER_PASSWORD_HASH:}
  auth:
    public-synthetic-members-only: ${PUBLIC_SYNTHETIC_MEMBERS_ONLY:false}
    access-ttl-seconds: ${AUTH_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${AUTH_REFRESH_TTL_SECONDS:28800}
    absolute-ttl-seconds: ${AUTH_ABSOLUTE_TTL_SECONDS:86400}
    max-active-sessions-per-principal: ${AUTH_MAX_ACTIVE_SESSIONS:5}
    login-failure-limit: ${AUTH_LOGIN_FAILURE_LIMIT:10}
    login-failure-window-seconds: ${AUTH_LOGIN_FAILURE_WINDOW_SECONDS:900}
    cleanup-interval-ms: ${AUTH_CLEANUP_INTERVAL_MS:3600000}
    cleanup-retention-seconds: ${AUTH_CLEANUP_RETENTION_SECONDS:86400}
    login-event-retention-seconds: ${AUTH_LOGIN_EVENT_RETENTION_SECONDS:2592000}
    cleanup-batch-size: ${AUTH_CLEANUP_BATCH_SIZE:200}
  versions:
    api: v1
    schema: "77"
    fixture: fin-mgmt-ab-v2.0.0
    algorithm: baseline-rules-v2.0.0
    policy: context-policy-v1.0.0
    source-catalog-checked-at: 2026-08-14

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

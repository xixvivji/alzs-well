server:
  address: 127.0.0.1

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alzs_well}
    username: ${DB_USERNAME:alzswell}
    password: ${DB_PASSWORD:alzs_well_local_password}

app:
  deployment:
    public-exposure: false
  features:
    local-auth-api-enabled: ${LOCAL_AUTH_API_ENABLED:true}
  cors:
    customer-allowed-origins: ${CORS_CUSTOMER_ALLOWED_ORIGINS:http://localhost:5173}
    staff-allowed-origins: ${CORS_STAFF_ALLOWED_ORIGINS:http://localhost:4173}
    require-https: false
  demo:
    staff-bootstrap-username: ${DEMO_STAFF_USERNAME}
    staff-bootstrap-password: ${DEMO_STAFF_PASSWORD}

server:
  address: 0.0.0.0

app:
  features:
    local-auth-api-enabled: ${SYNTHETIC_MEMBER_AUTH_ENABLED:false}
    customer-profile-api-enabled: ${SYNTHETIC_MEMBER_AUTH_ENABLED:false}
    public-synthetic-member-auth-enabled: ${SYNTHETIC_MEMBER_AUTH_ENABLED:false}
  auth:
    public-synthetic-members-only: ${SYNTHETIC_MEMBER_AUTH_ENABLED:false}
  cors:
    customer-allowed-origins: ${CORS_CUSTOMER_ALLOWED_ORIGINS}
    staff-allowed-origins: ${CORS_STAFF_ALLOWED_ORIGINS}
    require-https: true
  deployment:
    public-exposure: ${PUBLIC_DEPLOYMENT:true}
  ai-retrieval:
    tls:
      require-https: ${AI_TLS_REQUIRE_HTTPS:true}
  demo:
    staff-bootstrap-token: ${DEMO_STAFF_BOOTSTRAP_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

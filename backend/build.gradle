plugins {
	id 'java'
	id 'jacoco'
	id 'com.github.spotbugs' version '6.5.9'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.alzswell'
version = '0.0.1-SNAPSHOT'
description = "ALZ's well financial safety backend"

ext['tomcat.version'] = '10.1.57'
ext['postgresql.version'] = '42.7.12'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', 'test'
	finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
	toolVersion = '0.8.14'
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.90
			}
		}
		rule {
			element = 'CLASS'
			includes = [
				'com.alzswell.common.security.BearerTokenAuthenticationFilter',
				'com.alzswell.identity.application.AuthSessionService',
				'com.alzswell.identity.application.LocalIdentityProviderAdapter'
			]
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
	dependsOn tasks.named('spotbugsMain')
	dependsOn tasks.named('spotbugsTest')
}

spotbugs {
	ignoreFailures = false
	effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
	reportLevel = com.github.spotbugs.snom.Confidence.valueOf('DEFAULT')
	excludeFilter = file('config/spotbugs-exclude.xml')
}

tasks.named('spotbugsMain') {
	reports {
		html.required = true
		xml.required = true
	}
}

tasks.named('spotbugsTest') {
	reports {
		html.required = true
		xml.required = true
	}
}

// Spring의 애플리케이션 BOM이 SpotBugs 실행기 전용 의존성을 낮추지 않도록 분석기 classpath만 고정한다.
configurations.named('spotbugs') {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
			details.useVersion '3.20.0'
			details.because 'SpotBugs 4.10.3/BCEL 6.12 requires org.apache.commons.lang3.Strings'
		}
	}
}

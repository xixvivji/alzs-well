server {
    listen 8443 ssl;
    server_name _;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AI_MTLS:10m;
    ssl_session_timeout 10m;
    ssl_certificate /run/secrets/ai-server.crt;
    ssl_certificate_key /run/secrets/ai-server.key;
    ssl_client_certificate /run/secrets/client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    client_max_body_size 256k;

    location / {
        proxy_pass http://ai-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
}

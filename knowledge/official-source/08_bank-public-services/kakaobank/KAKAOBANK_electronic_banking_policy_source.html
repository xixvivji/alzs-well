    <script id="mNavMenuTemplate" type="text/template">
        <ul class="nav-list">
            <% _.each(sitemap.map, function(navItem){%>
            <% if(navItem.child) { %>
            <li class="list-group">
                <div class="list-item">
                    <a href="javascript:;" title="<%=navItem.name%> 메뉴 토글" class="list-title">
                        <%=navItem.name%>
                        <span class="btn-arrow ir">메뉴 토글</span>
                    </a>
                </div>
                <div class="list-contents">
                    <% _.each(navItem.child, function(subItem) { %>
                    <div class="list-content">
                        <em class="sub-title"><%=subItem.name%></em>
                        <ul class="sub-list">
                            <% _.each(subItem.child, function(linkItem) { %>
                            <li>
                                <% if(linkItem.isTargetBlank) { %>
                                <a href="<%= linkItem.relativePath ? linkItem.relativePath : linkItem.url %>"
                                   target="_blank" title="새창열림"><%=linkItem.name%></a>
                                <% } else { %>
                                <a href="<%= linkItem.relativePath ? linkItem.relativePath : linkItem.url %>"><%=linkItem.name%></a>
                                <% } %>
                            </li>
                            <% }) %>
                        </ul>
                    </div>
                    <% }) %>
                </div>
            </li>
            <% } else { %>
            <li>
                <div class="list-item">
                    <% if(navItem.isTargetBlank) { %>
                    <a href="<%= navItem.relativePath ? navItem.relativePath : navItem.url %>" class="list-title"
                       target="_blank" title="새창열림"><%=navItem.name%></a>
                    <% } else { %>
                    <a href="<%= navItem.relativePath ? navItem.relativePath : navItem.url %>" class="list-title"><%=navItem.name%></a>
                    <% } %>
                </div>
            </li>
            <% } %>
            <% }) %>
        </ul>
        <div class="family-links">
            <ul class="nav-list">
                <li class="list-group">
                    <div class="list-item">
                        <a href="javascript:;" title="관련사이트" class="list-title">관련사이트<span
                                class="btn-arrow ir">메뉴 토글</span></a>
                    </div>
                    <div class="list-contents">
                        <div class="list-content">
                            <ul class="sub-list" id="familyLinks">
                                <% _.each(sitemap.family, function(site){%>
                                <li>
                                    <a href="<%= site.url %>" title="<%= site.name %> 새창"
                                       target="<%= site.isTargetBlank ? '_blank' : ''%>">
                                        <span><%= site.name %></span><span class="ico-newtab"></span>
                                    </a>
                                </li>
                                <% }); %>
                            </ul>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </script>

<script id="QuantumPaginationTemplate" type="text/template">
    <div class="paging_kabang">
        <div class="inner_paging">
            <% if (currentPageNumber !== 1){ %>
            <a href="/<%= initialPath %>/pages/<%= currentPageNumber - 1 %>" class="btn_page btn_prev img_arrow img_prev">
<!--                <span class="img_arrow img_prev"/>-->
                <span class="screen_out">이전 페이지로 이동</span>
            </a>
            <% } else { %>
            <a href="javascript:;" class="btn_page btn_prev img_arrow img_prev_dis">
<!--                <span class="img_arrow img_prev_dis"/>-->
                <span class="screen_out">첫 페이지</span>
            </a>
            <% } %>

            <span class="link_page" style="color:#333"><%= currentPageNumber %> / <%= lastPageNumber %></span>
            <% if (currentPageNumber < lastPageNumber){ %>
            <a href="/<%= initialPath %>/pages/<%= currentPageNumber + 1 %>" class="btn_page btn_next img_arrow img_next">
<!--                <span class="img_arrow img_next"/>-->
                <span class="screen_out">다음 페이지로 이동</span>
            </a>
            <% } else { %>
            <a href="javascript:;" class="btn_page btn_next img_arrow img_next_dis">
<!--                <span class="img_arrow img_next_dis"/>-->
                <span class="screen_out">마지막 페이지</span>
            </a>

            <% } %>
        </div>
    </div>
</script>

AWSTemplateFormatVersion: "2010-09-09"
Description: ALZ's well cost-conscious synthetic-data staging foundation

Parameters:
  EnvironmentName:
    Type: String
    Default: alzs-well-staging
    AllowedPattern: "^[a-z0-9-]+$"
  CloudFrontOriginPrefixListId:
    Type: String
    Default: pl-22a6434b
    Description: AWS-managed com.amazonaws.global.cloudfront.origin-facing prefix list in ap-northeast-2
    AllowedPattern: "^pl-[0-9a-f]+$"
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  AppInstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium]
  AiInstanceType:
    Type: String
    Default: m7i-flex.large
    AllowedValues: [t3.medium, t3.large, m7i-flex.large, m7i.large]
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small]
  DatabaseBootstrapEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Temporarily allow one-time DB role provisioning and AI ingestion secrets
  AppMigrationDeploymentEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Temporarily allow the app host to read only the migration database secret during deployment
  ImagePublishDeploymentEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Temporarily allow the AI build host to publish immutable app and AI images only
  DatabaseDeletionProtectionEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable only after initial provisioning and rehearsal verification
  AlbDeletionProtectionEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable only after initial provisioning and rehearsal verification

Conditions:
  EnableDatabaseBootstrap: !Equals [!Ref DatabaseBootstrapEnabled, "true"]
  EnableAppMigrationDeployment: !Equals [!Ref AppMigrationDeploymentEnabled, "true"]
  EnableImagePublishDeployment: !Equals [!Ref ImagePublishDeploymentEnabled, "true"]
  ProtectDatabase: !Equals [!Ref DatabaseDeletionProtectionEnabled, "true"]
  ProtectAlb: !Equals [!Ref AlbDeletionProtectionEnabled, "true"]

Mappings:
  Network:
    Cidr:
      Vpc: 10.42.0.0/16
      PublicA: 10.42.0.0/24
      PublicC: 10.42.1.0/24
      AppA: 10.42.10.0/24
      AppC: 10.42.11.0/24
      DatabaseA: 10.42.20.0/24
      DatabaseC: 10.42.21.0/24

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [Network, Cidr, Vpc]
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-vpc"}, {Key: Project, Value: alzs-well}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-igw"}, {Key: Project, Value: alzs-well}]
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway}

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !FindInMap [Network, Cidr, PublicA]
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-public-a"}, {Key: Project, Value: alzs-well}]
  PublicSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !FindInMap [Network, Cidr, PublicC]
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-public-c"}, {Key: Project, Value: alzs-well}]
  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !FindInMap [Network, Cidr, AppA]
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-app-a"}, {Key: Project, Value: alzs-well}]
  AppSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !FindInMap [Network, Cidr, AppC]
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-app-c"}, {Key: Project, Value: alzs-well}]
  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !FindInMap [Network, Cidr, DatabaseA]
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-db-a"}, {Key: Project, Value: alzs-well}]
  DatabaseSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !FindInMap [Network, Cidr, DatabaseC]
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-db-c"}, {Key: Project, Value: alzs-well}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-public-rt"}, {Key: Project, Value: alzs-well}]
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable}
  PublicRouteAssociationC:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetC, RouteTableId: !Ref PublicRouteTable}

  NatElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-nat-eip"}, {Key: Project, Value: alzs-well}]
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatElasticIp.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-nat"}, {Key: Project, Value: alzs-well}]
  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-app-rt"}, {Key: Project, Value: alzs-well}]
  AppDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  AppRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnetA, RouteTableId: !Ref AppRouteTable}
  AppRouteAssociationC:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnetC, RouteTableId: !Ref AppRouteTable}
  DatabaseRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-db-rt"}, {Key: Project, Value: alzs-well}]
  DatabaseRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DatabaseSubnetA, RouteTableId: !Ref DatabaseRouteTable}
  DatabaseRouteAssociationC:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DatabaseSubnetC, RouteTableId: !Ref DatabaseRouteTable}
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds: [!Ref AppRouteTable]

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP origin traffic from CloudFront only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontOriginPrefixListId
          Description: AWS-managed CloudFront origin-facing network only
      SecurityGroupEgress: []
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-alb-sg"}, {Key: Project, Value: alzs-well}]
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Spring application tier
      VpcId: !Ref Vpc
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: Package bootstrap}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: AWS APIs and registries}
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-app-sg"}, {Key: Project, Value: alzs-well}]
  AiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal AI tier
      VpcId: !Ref Vpc
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: Package bootstrap}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: AWS APIs and registries}
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-ai-sg"}, {Key: Project, Value: alzs-well}]
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from application tiers only
      VpcId: !Ref Vpc
      SecurityGroupIngress: []
      SecurityGroupEgress: []
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-db-sg"}, {Key: Project, Value: alzs-well}]
  AlbToAppEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: 8080, ToPort: 8080, DestinationSecurityGroupId: !Ref AppSecurityGroup}
  AppFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref AppSecurityGroup, IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSecurityGroup}
  AppToAiEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref AppSecurityGroup, IpProtocol: tcp, FromPort: 8443, ToPort: 8443, DestinationSecurityGroupId: !Ref AiSecurityGroup}
  AiFromAppIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref AiSecurityGroup, IpProtocol: tcp, FromPort: 8443, ToPort: 8443, SourceSecurityGroupId: !Ref AppSecurityGroup}
  AppToDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref AppSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DatabaseSecurityGroup}
  AiToDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref AiSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DatabaseSecurityGroup}
  DatabaseFromAppIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref DatabaseSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup}
  DatabaseFromAiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref DatabaseSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AiSecurityGroup}

  AppRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: alzs-well/backend
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
      EmptyOnDelete: false
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  AiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: alzs-well/ai-service
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
      EmptyOnDelete: false
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]

  ProxySharedSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "/${EnvironmentName}/proxy-shared-secret"
      GenerateSecretString: {PasswordLength: 64, ExcludePunctuation: true}
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  StaffBootstrapSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "/${EnvironmentName}/staff-bootstrap-token"
      GenerateSecretString: {PasswordLength: 80, ExcludePunctuation: true}
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]

  SyntheticMemberPasswordHashSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "/${EnvironmentName}/synthetic-member-password-hash"
      Description: BCrypt hash only for public synthetic member, staff and admin accounts
      SecretString: INVALID_REPLACE_BEFORE_ENABLING_PUBLIC_SYNTHETIC_AUTH
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  InternalAiSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "/${EnvironmentName}/internal-ai-token"
      GenerateSecretString: {PasswordLength: 80, ExcludePunctuation: true}
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  AppTlsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "/${EnvironmentName}/tls-app"
      GenerateSecretString:
        SecretStringTemplate: '{"status":"BOOTSTRAP_REQUIRED"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  AiTlsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "/${EnvironmentName}/tls-ai"
      SecretString: '{"status":"BOOTSTRAP_REQUIRED"}'
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  MasterDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "/${EnvironmentName}/db-master-runtime"
      GenerateSecretString:
        SecretStringTemplate: '{"username":"alzswell_admin"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  AppDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "/${EnvironmentName}/db-app"
      GenerateSecretString:
        SecretStringTemplate: '{"username":"alzswell_app"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  MigrationDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "/${EnvironmentName}/db-migration"
      GenerateSecretString:
        SecretStringTemplate: '{"username":"alzswell_migrator"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  AiIngestionDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "/${EnvironmentName}/db-ai-ingestion"
      GenerateSecretString:
        SecretStringTemplate: '{"username":"alzswell_ai_ingestor"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  AiRuntimeDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "/${EnvironmentName}/db-ai-runtime"
      GenerateSecretString:
        SecretStringTemplate: '{"username":"alzswell_ai_runtime"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated ALZ's well database subnets
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetC]
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-db-subnets"}, {Key: Project, Value: alzs-well}]
  DatabaseParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Enforce TLS for ALZ's well PostgreSQL
      Family: postgres17
      Parameters: {rds.force_ssl: "1"}
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-postgres"
      Engine: postgres
      EngineVersion: "17.6"
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: alias/aws/rds
      DBName: alzswell
      MasterUsername: alzswell_admin
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${MasterDatabaseSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DBParameterGroupName: !Ref DatabaseParameterGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      DeletionProtection: !If [ProtectDatabase, true, false]
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: false
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/${EnvironmentName}/app"
      RetentionInDays: 14
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  AiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/${EnvironmentName}/ai"
      RetentionInDays: 14
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]

  AppRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-app-runtime"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: "sts:AssumeRole"}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
      Policies:
        - PolicyName: ReadDeploymentArtifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: "ecr:GetAuthorizationToken", Resource: "*"}
              - Effect: Allow
                Action: ["ecr:BatchCheckLayerAvailability", "ecr:GetDownloadUrlForLayer", "ecr:BatchGetImage"]
                Resource: !GetAtt AppRepository.Arn
              - Effect: Allow
                Action: "secretsmanager:GetSecretValue"
                Resource: [!Ref ProxySharedSecret, !Ref StaffBootstrapSecret, !Ref SyntheticMemberPasswordHashSecret, !Ref InternalAiSecret, !Ref AppTlsSecret, !Ref AppDatabaseSecret]
              - Effect: Allow
                Action: ["logs:CreateLogStream", "logs:DescribeLogStreams", "logs:PutLogEvents"]
                Resource: !Sub "${AppLogGroup.Arn}:*"
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  AppRuntimeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${EnvironmentName}-app-runtime"
      Roles: [!Ref AppRuntimeRole]
  AiRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-ai-runtime"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: "sts:AssumeRole"}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
      Policies:
        - PolicyName: ReadDeploymentArtifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: "ecr:GetAuthorizationToken", Resource: "*"}
              - Effect: Allow
                Action: ["ecr:BatchCheckLayerAvailability", "ecr:GetDownloadUrlForLayer", "ecr:BatchGetImage"]
                Resource: !GetAtt AiRepository.Arn
              - Effect: Allow
                Action: "secretsmanager:GetSecretValue"
                Resource: [!Ref InternalAiSecret, !Ref AiTlsSecret, !Ref AiRuntimeDatabaseSecret]
              - Effect: Allow
                Action: ["logs:CreateLogStream", "logs:DescribeLogStreams", "logs:PutLogEvents"]
                Resource: !Sub "${AiLogGroup.Arn}:*"
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  AiRuntimeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${EnvironmentName}-ai-runtime"
      Roles: [!Ref AiRuntimeRole]
  StagingOperatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-operator"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"}
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: OperateTaggedStagingInstances
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "ssm:SendCommand"
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Effect: Allow
                Action: "ssm:SendCommand"
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    "ssm:resourceTag/Project": alzs-well
                    "ssm:resourceTag/Environment": staging
              - Effect: Allow
                Action: ["ssm:GetCommandInvocation", "ssm:ListCommandInvocations", "ssm:ListCommands"]
                Resource: "*"
              - Effect: Allow
                Action: ["ec2:DescribeInstances", "cloudformation:DescribeStacks"]
                Resource: "*"
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  DatabaseBootstrapPolicy:
    Type: AWS::IAM::Policy
    Condition: EnableDatabaseBootstrap
    Properties:
      PolicyName: DatabaseRoleBootstrap
      Roles: [!Ref AppRuntimeRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "secretsmanager:GetSecretValue"
            Resource:
              - !Ref MasterDatabaseSecret
              - !Ref MigrationDatabaseSecret
              - !Ref AiIngestionDatabaseSecret
              - !Ref AiRuntimeDatabaseSecret
          - Effect: Allow
            Action: "secretsmanager:PutSecretValue"
            Resource: [!Ref AppTlsSecret, !Ref AiTlsSecret, !Ref ProxySharedSecret]
  AppMigrationDeploymentPolicy:
    Type: AWS::IAM::Policy
    Condition: EnableAppMigrationDeployment
    Properties:
      PolicyName: AppMigrationDeployment
      Roles: [!Ref AppRuntimeRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "secretsmanager:GetSecretValue"
            Resource: !Ref MigrationDatabaseSecret
  AiIngestionPolicy:
    Type: AWS::IAM::Policy
    Condition: EnableDatabaseBootstrap
    Properties:
      PolicyName: ApprovedDocumentIngestion
      Roles: [!Ref AiRuntimeRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "secretsmanager:GetSecretValue"
            Resource: !Ref AiIngestionDatabaseSecret
  ImagePublishDeploymentPolicy:
    Type: AWS::IAM::Policy
    Condition: EnableImagePublishDeployment
    Properties:
      PolicyName: ImagePublishDeployment
      Roles: [!Ref AiRuntimeRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "ecr:BatchCheckLayerAvailability"
              - "ecr:CompleteLayerUpload"
              - "ecr:InitiateLayerUpload"
              - "ecr:PutImage"
              - "ecr:UploadLayerPart"
            Resource: [!GetAtt AppRepository.Arn, !GetAtt AiRepository.Arn]

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref AppInstanceType
      IamInstanceProfile: !Ref AppRuntimeInstanceProfile
      SubnetId: !Ref AppSubnetA
      SecurityGroupIds: [!Ref AppSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      MetadataOptions: {HttpEndpoint: enabled, HttpTokens: required, InstanceMetadataTags: enabled}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker
          systemctl enable --now docker
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-app"}, {Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  AiInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref AiInstanceType
      IamInstanceProfile: !Ref AiRuntimeInstanceProfile
      SubnetId: !Ref AppSubnetC
      SecurityGroupIds: [!Ref AiSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 50, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      MetadataOptions: {HttpEndpoint: enabled, HttpTokens: required, InstanceMetadataTags: enabled}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker
          systemctl enable --now docker
      Tags: [{Key: Name, Value: !Sub "${EnvironmentName}-ai"}, {Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]

  PrivateHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: internal
      HostedZoneConfig: {Comment: Private service discovery for ALZ's well staging}
      VPCs: [{VPCId: !Ref Vpc, VPCRegion: !Ref "AWS::Region"}]
      HostedZoneTags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  AiPrivateDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PrivateHostedZone
      Name: ai.internal
      Type: A
      TTL: 60
      ResourceRecords: [!GetAtt AiInstance.PrivateIp]

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: alzs-well-staging-app
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8080
      TargetType: instance
      Targets: [{Id: !Ref AppInstance, Port: 8080}]
      HealthCheckEnabled: true
      HealthCheckPath: /api/v1/system/readiness
      Matcher: {HttpCode: "200"}
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: alzs-well-staging
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetC]
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: !If [ProtectAlb, "true", "false"]
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: "true"}
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  HttpOriginListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref AppTargetGroup}]

  CloudFrontNoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${EnvironmentName}-no-cache"
        Comment: Never cache authenticated financial API responses
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: {CookieBehavior: none}
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
  CloudFrontApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${EnvironmentName}-api-origin"
        Comment: Forward API request context except the viewer Host header
        CookiesConfig: {CookieBehavior: all}
        HeadersConfig: {HeaderBehavior: allExcept, Headers: [host]}
        QueryStringsConfig: {QueryStringBehavior: all}
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: ALZ's well staging API entry point
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: staging-alb-origin
            DomainName: !GetAtt ApplicationLoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: staging-alb-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: !Ref CloudFrontNoCachePolicy
          OriginRequestPolicyId: !Ref CloudFrontApiOriginRequestPolicy
          Compress: true
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${EnvironmentName}-web-acl"
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: alzs-well-staging, SampledRequestsEnabled: true}
      Rules:
        - Name: AwsCommonRules
          Priority: 0
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesCommonRuleSet}}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: common-rules, SampledRequestsEnabled: true}
        - Name: SessionCreationRateLimit
          Priority: 1
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 100
              EvaluationWindowSec: 60
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch: {UriPath: {}}
                  PositionalConstraint: EXACTLY
                  SearchString: /api/v1/demo/sessions
                  TextTransformations: [{Priority: 0, Type: NONE}]
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: session-rate, SampledRequestsEnabled: true}
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties: {ResourceArn: !Ref ApplicationLoadBalancer, WebACLArn: !GetAtt WebAcl.Arn}

  AppStatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-app-status-check"
      AlarmDescription: App EC2 status check failed
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{Name: InstanceId, Value: !Ref AppInstance}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  AiStatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-ai-status-check"
      AlarmDescription: AI EC2 status check failed
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{Name: InstanceId, Value: !Ref AiInstance}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  DatabaseCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-database-cpu"
      AlarmDescription: RDS CPU usage remains high
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions: [{Name: DBInstanceIdentifier, Value: !Ref Database}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]
  DatabaseFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-database-free-storage"
      AlarmDescription: RDS free storage below 2 GiB
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{Name: DBInstanceIdentifier, Value: !Ref Database}]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      Tags: [{Key: Project, Value: alzs-well}, {Key: Environment, Value: staging}]

Outputs:
  VpcId: {Value: !Ref Vpc}
  AlbDnsName: {Value: !GetAtt ApplicationLoadBalancer.DNSName}
  CloudFrontApiDomainName: {Value: !GetAtt CloudFrontDistribution.DomainName}
  CloudFrontApiUrl: {Value: !Sub "https://${CloudFrontDistribution.DomainName}"}
  AppInstanceId: {Value: !Ref AppInstance}
  AiInstanceId: {Value: !Ref AiInstance}
  DatabaseEndpoint: {Value: !GetAtt Database.Endpoint.Address}
  DatabaseMasterSecretArn: {Value: !Ref MasterDatabaseSecret}
  AppDatabaseSecretArn: {Value: !Ref AppDatabaseSecret}
  MigrationDatabaseSecretArn: {Value: !Ref MigrationDatabaseSecret}
  AiIngestionDatabaseSecretArn: {Value: !Ref AiIngestionDatabaseSecret}
  AiRuntimeDatabaseSecretArn: {Value: !Ref AiRuntimeDatabaseSecret}
  AppTlsSecretArn: {Value: !Ref AppTlsSecret}
  AiTlsSecretArn: {Value: !Ref AiTlsSecret}
  SyntheticMemberPasswordHashSecretArn: {Value: !Ref SyntheticMemberPasswordHashSecret}
  AppLogGroupName: {Value: !Ref AppLogGroup}
  AiLogGroupName: {Value: !Ref AiLogGroup}
  StagingOperatorRoleArn: {Value: !GetAtt StagingOperatorRole.Arn}
  AppRepositoryUri: {Value: !GetAtt AppRepository.RepositoryUri}
  AiRepositoryUri: {Value: !GetAtt AiRepository.RepositoryUri}

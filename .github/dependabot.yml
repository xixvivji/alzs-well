version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Asia/Seoul
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: pip
    directory: /ai-service
    schedule:
      interval: weekly
      day: monday
      time: "09:40"
      timezone: Asia/Seoul
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Seoul
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope

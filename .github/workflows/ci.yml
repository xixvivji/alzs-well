name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  api-contract:
    name: API catalog contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate API catalog counts and uniqueness
        run: python3 scripts/validate_api_catalog.py
      - name: Validate public repository metadata
        run: python3 scripts/validate_public_repository_metadata.py

  backend:
    name: Backend test and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and enforce coverage
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew check jacocoTestReport jacocoTestCoverageVerification --no-daemon 2>&1 | tee gradle-attempt.log; then
              exit 0
            fi
            if ! grep -Eq 'status code 429|Too Many Requests' gradle-attempt.log || [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Maven 저장소가 요청을 제한했습니다. $((attempt * 10))초 후 재시도합니다. ($attempt/3)"
            sleep $((attempt * 10))
          done
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-and-coverage-reports
          path: |
            backend/build/reports/tests/test
            backend/build/reports/jacoco/test
            backend/build/reports/spotbugs
          # 선행 Gradle 구성·다운로드 실패 시 원래 오류를 artifact 오류로 덮지 않는다.
          if-no-files-found: warn
          retention-days: 14
      - name: Publish PR coverage report
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: backend/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 90
          min-coverage-changed-files: 80
          update-comment: true

  ai-service:
    name: AI ingestion test and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.30
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Test and enforce coverage
        run: uv run pytest --cov=app --cov-report=term-missing -p no:cacheprovider
      - name: Enforce retrieval quality gate
        run: |
          uv run python -m app.evaluation.cli evaluate \
            --corpus evaluation/datasets/retrieval-corpus-v1.jsonl \
            --dataset evaluation/datasets/retrieval-v1.jsonl \
            --output-json data/derived/evaluation/retrieval-v1.json \
            --output-markdown data/derived/evaluation/retrieval-v1.md \
            --fail-on-gate
          uv run python -m app.evaluation.cli tune \
            --corpus evaluation/datasets/retrieval-corpus-v1.jsonl \
            --dataset evaluation/datasets/retrieval-v1.jsonl \
            --output-json data/derived/evaluation/tuning-v1.json
          uv run python -m app.evaluation.safety_cli \
            --dataset evaluation/datasets/ai-safety-policy-v1.jsonl \
            --output-json data/derived/evaluation/ai-safety-policy-v1.json
      - name: Upload retrieval evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-evaluation-reports
          path: ai-service/data/derived/evaluation
          if-no-files-found: warn
          retention-days: 14

  ai-sca:
    name: Python and model runtime vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.11.30
      - name: Audit locked Python and model dependencies
        working-directory: ai-service
        run: uv audit --locked --python-version 3.12 --python-platform linux
      - name: Build the offline model runtime image
        run: >-
          docker build
          --file ai-service/Dockerfile.model-runtime
          --tag alzs-well-ai-model-runtime:ci
          ai-service
      - name: Scan OS and Python packages in the model runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: alzs-well-ai-model-runtime:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table

  frontend:
    name: Frontend lint, build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Reject high-severity production or build dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: alzs-well-ci-${{ github.run_id }}-${{ github.run_attempt }}
      BACKEND_PORT: "18080"
      GATEWAY_BIND_ADDRESS: 127.0.0.1
      POSTGRES_DB: alzs_well_ci
      POSTGRES_USER: alzswell_ci_admin
      POSTGRES_PASSWORD: ci-only-admin-password-please-never-use-in-production
      POSTGRES_MIGRATION_PASSWORD: ci-only-migration-password-never-use-in-production
      POSTGRES_APP_PASSWORD: ci-only-runtime-password-never-use-in-production
      POSTGRES_AI_PASSWORD: ci-only-ai-ingestion-password-never-use-in-production
      POSTGRES_AI_RUNTIME_PASSWORD: ci-only-ai-runtime-password-never-use-in-production
      AI_INTERNAL_TOKEN: ci-only-internal-ai-token-never-use-in-production
      FRONTEND_PROXY_SHARED_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CORS_CUSTOMER_ALLOWED_ORIGINS: https://customer-ci.example.invalid
      CORS_STAFF_ALLOWED_ORIGINS: https://staff-ci.example.invalid
      DEMO_STAFF_BOOTSTRAP_TOKEN: ci-only-demo-staff-bootstrap-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate AWS deployment Compose and role contracts
        run: python3 scripts/validate_aws_deployment_config.py
      - name: Install pinned CloudFormation linter
        run: python3 -m pip install cfn-lint==1.55.1
      - name: Lint AWS staging CloudFormation
        run: cfn-lint infra/aws-staging/foundation.yaml
      - name: Validate AWS execution policy rendering
        run: |
          infra/aws-staging/render-cfn-execution-policy.sh 123456789012 \
            | jq -e '
                .Version == "2012-10-17"
                and ([.. | strings | select(contains("__AWS_ACCOUNT_ID__"))] | length) == 0
                and ([.. | strings | select(contains("123456789012"))] | length) > 0
              '
      - name: Validate production compose rendering
        run: docker compose --project-directory backend --env-file backend/.env.example config --quiet
      - name: Boot the isolated stack and smoke test core APIs
        run: bash .github/scripts/compose-smoke.sh
      - name: Verify three demo scenarios, grounded citations and fallback
        run: python3 scripts/copilot_rag_e2e.py
      - name: Upload Compose integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-integration-evidence
          path: |
            artifacts/compose-smoke
            artifacts/copilot-rag-e2e
          if-no-files-found: warn
          retention-days: 14

  dependency-review:
    name: Dependency review
    # GitHub Dependency Review is unavailable for a private repository without GHAS.
    # Independent Java, Python, npm and container SCA jobs remain mandatory.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  backend-sca:
    name: Java and container vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the deployable Spring Boot artifact
        working-directory: backend
        run: ./gradlew clean bootJar --no-daemon
      - name: Scan Java runtime dependencies in the deployable artifact
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend/build/libs
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
      - name: Build the backend runtime image
        run: docker build --tag alzs-well-backend:ci backend
      - name: Scan OS and Java packages in the runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: alzs-well-backend:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
      - name: Build the hardened gateway image
        run: >-
          docker build
          --file backend/docker/Dockerfile.gateway
          --tag alzs-well-gateway:ci
          backend/docker
      - name: Scan OS packages in the gateway image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: alzs-well-gateway:ci
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table

  quality-gate:
    name: CI quality gate
    if: always()
    needs:
      - api-contract
      - backend
      - ai-service
      - ai-sca
      - frontend
      - compose
      - dependency-review
      - backend-sca
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory CI job to pass
        env:
          API_CONTRACT_RESULT: ${{ needs.api-contract.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          AI_SERVICE_RESULT: ${{ needs.ai-service.result }}
          AI_SCA_RESULT: ${{ needs.ai-sca.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          BACKEND_SCA_RESULT: ${{ needs.backend-sca.result }}
        run: |
          set -eu
          for result in \
            "$API_CONTRACT_RESULT" \
            "$BACKEND_RESULT" \
            "$AI_SERVICE_RESULT" \
            "$AI_SCA_RESULT" \
            "$FRONTEND_RESULT" \
            "$COMPOSE_RESULT" \
            "$BACKEND_SCA_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "필수 CI 작업이 통과하지 못했습니다: $result" >&2
              exit 1
            fi
          done
          if [ "$DEPENDENCY_REVIEW_RESULT" != "success" ] && [ "$DEPENDENCY_REVIEW_RESULT" != "skipped" ]; then
            echo "의존성 변경 검토가 통과하지 못했습니다: $DEPENDENCY_REVIEW_RESULT" >&2
            exit 1
          fi

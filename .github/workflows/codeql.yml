name: CodeQL

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: "17 19 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    if: vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
      - name: Build Java for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: backend
        run: ./gradlew classes testClasses --no-daemon
      - uses: github/codeql-action/analyze@v4

  quality-gate:
    name: CodeQL quality gate
    if: always()
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Require every language analysis to pass
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          if [ "$ANALYZE_RESULT" != "success" ]; then
            echo "CodeQL 분석이 통과하지 못했습니다: $ANALYZE_RESULT" >&2
            exit 1
          fi
